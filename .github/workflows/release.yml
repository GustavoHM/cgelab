name: release

# Publishes to TestPyPI and then to PyPI when a tag vX.Y.Z is pushed, by trusted
# publishing: no token is stored in the repository. Set-up, once per index
# (test.pypi.org and pypi.org): Account > Publishing > add a pending publisher
# with owner GustavoHM, repository cgelab, workflow release.yml, and the
# environment named below (testpypi, pypi). In the repository settings, create
# the two environments; giving pypi a required reviewer makes the final upload
# wait for a click after TestPyPI has succeeded. See CONTRIBUTING.md, "Releasing".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The tag must match the version in pyproject.toml, the package and CITATION.cff
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
          grep -qx "__version__ = \"$version\"" src/cgelab/__init__.py || { echo "src/cgelab/__init__.py is not $version"; exit 1; }
          grep -qx "version: \"$version\"" CITATION.cff || { echo "CITATION.cff is not $version"; exit 1; }
      # The dsge extra needs dsgelab on PyPI itself. The TestPyPI check below would
      # also accept a dsgelab that only reached TestPyPI, so look at PyPI alone,
      # before anything is uploaded.
      - name: dsgelab, required by the dsge extra, must be on PyPI
        run: |
          python -m pip download --no-deps --index-url https://pypi.org/simple/ \
            -d /tmp/dsgelab-check "$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['dsge'][0])")"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cgelab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run of the whole workflow finds the files already there.
          skip-existing: true

  # Install what TestPyPI now serves, with dependencies from PyPI, and run the
  # suite against it before the real upload. The dsge extra pulls dsgelab>=0.5
  # from PyPI, so dsgelab 0.5 has to be published first.
  check-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    env:
      CGELAB_TEST_INSTALLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install from TestPyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in 1 2 3 4 5 6; do
            python -m pip install --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ "cgelab[test,parquet,dsge]==$version" && break
            test "$i" = 6 && { echo "could not install cgelab $version from TestPyPI"; exit 1; }
            sleep 30   # the index can take a moment to serve a new upload
          done
          python -c "import cgelab; assert cgelab.__version__ == '$version'"
      - run: python -m pytest -q

  pypi:
    needs: check-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cgelab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
