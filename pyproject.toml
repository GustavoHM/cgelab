[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cgelab"
version = "0.8.0"
description = "General-purpose toolkit for SAM-based computable general equilibrium models: balancing, calibration, closures, CET trade, institutions and foreign ownership, recursive dynamics with several capital stocks, and welfare."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gustavo Hoffmann Moreira", email = "gustavo@gakusai.net"}]
keywords = ["cge", "general equilibrium", "social accounting matrix", "input-output", "armington"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://gustavohm.github.io/cgelab/"
Documentation = "https://github.com/GustavoHM/cgelab/tree/main/docs"
Repository = "https://github.com/GustavoHM/cgelab"
Issues = "https://github.com/GustavoHM/cgelab/issues"
Changelog = "https://github.com/GustavoHM/cgelab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dsge = ["dsgelab>=0.5"]
plot = ["matplotlib>=3.7"]
# The IBGE publishes its supply and use tables as .xls; read_tru reads them through pandas.
ibge = ["xlrd>=2"]
test = ["pytest>=7"]
# The simultaneous backend; IPOPT itself: python -m amplpy.modules install ipopt
pyomo = ["pyomo>=6.7", "amplpy>=0.14"]

[project.scripts]
cgelab = "cgelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cgelab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode tests the source tree without an install and keeps
# test modules from colliding with same-named modules elsewhere on the path.
addopts = "--import-mode=importlib"
