[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgelab"
version = "0.2.0"
description = "General-purpose toolkit for SAM-based computable general equilibrium models: balancing, calibration, closures, CET trade, institutions and foreign ownership, recursive dynamics with several capital stocks, and welfare."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Gustavo Hoffmann Moreira", email = "gustavo@gakusai.net"}]
keywords = ["cge", "general equilibrium", "social accounting matrix", "input-output", "armington"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://gustavohm.github.io/cgelab/"
Documentation = "https://github.com/GustavoHM/cgelab/tree/main/docs"
Repository = "https://github.com/GustavoHM/cgelab"
Issues = "https://github.com/GustavoHM/cgelab/issues"
Changelog = "https://github.com/GustavoHM/cgelab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dsge = ["dsgelab>=0.4"]
test = ["pytest>=7"]

[project.scripts]
cgelab = "cgelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cgelab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode tests the source tree without an install and keeps
# test modules from colliding with same-named modules elsewhere on the path.
addopts = "--import-mode=importlib"
